<!DOCTYPE html>
<html>
<head>
<title>Blood Donor Registration</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f7e9e9;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: #c22727;
  }
  form {
    width: 460px;
    margin: 0 auto;
    padding: 15px 20px;
    background: #f9f4f4;
    border: 2px solid #911818;
    border-radius: 8px;
  }
  .row {
    margin-bottom: 6px;
    min-height: 40px;
  }
  label.main {
    display: inline-block;
    width: 130px;
  }
  .err {
    color: red;
    font-size: 12px;
    margin-left: 134px;
    min-height: 14px;
  }
  #count {
    text-align: center;
    font-weight: bold;
  }
  table {
    border-collapse: collapse;
    margin: 0 auto;
    min-width: 600px;
    background: #ffffff;
  }
  th, td {
    border: 1px solid #4b4a4a;
    padding: 6px 8px;
    text-align: left;
  }
  th {
    background: #e8b8b5;
  }
</style>
</head>
<body>

<h1>Blood Donor Registration</h1>

<form id="regForm" method="post" novalidate onsubmit="return validateForm()">

  <div class="row">
    <label class="main" for="fname">Full Name</label>
    <input type="text" id="fname" name="fname" required minlength="3">
    <div class="err" id="err-fname"></div>
  </div>

  <div class="row">
    <label class="main" for="sid">AIUB ID</label>
    <input type="text" id="sid" name="sid" required pattern="[0-9]{2}-[0-9]{5}-[0-9]">
    <div class="err" id="err-sid"></div>
  </div>

  <div class="row">
    <label class="main" for="phone">Mobile</label>
    <input type="text" id="phone" name="phone" required pattern="[0-9]{11}">
    <div class="err" id="err-phone"></div>
  </div>

  <div class="row">
    <label class="main" for="age">Age</label>
    <input type="number" id="age" name="age" required min="18" max="60">
    <div class="err" id="err-age"></div>
  </div>

  <div class="row">
    <label class="main" for="bgroup">Blood Group</label>
    <select id="bgroup" name="bgroup" required>
      <option value="">Select blood group</option>
      <option value="A+">A+</option>
      <option value="A-">A-</option>
      <option value="B+">B+</option>
      <option value="B-">B-</option>
      <option value="O+">O+</option>
      <option value="O-">O-</option>
      <option value="AB+">AB+</option>
      <option value="AB-">AB-</option>
    </select>
    <div class="err" id="err-bgroup"></div>
  </div>

  <div class="row">
    <label class="main">Donated before?</label>
    <input type="radio" id="donated-yes" name="donated" value="Yes" required>
    <label for="donated-yes">Yes</label>
    <input type="radio" id="donated-no" name="donated" value="No" required>
    <label for="donated-no">No</label>
    <div class="err" id="err-donated"></div>
  </div>

  <div class="row">
    <input type="checkbox" id="agree" name="agree" required>
    <label for="agree">I am healthy and willing to donate</label>
    <div class="err" id="err-agree"></div>
  </div>

  <div class="row">
    <label class="main" for="pass">Password</label>
    <input type="password" id="pass" name="pass" required minlength="6">
    <div class="err" id="err-pass"></div>
  </div>

  <div class="row">
    <label class="main" for="pass2">Confirm Password</label>
    <input type="password" id="pass2" name="pass2" required>
    <div class="err" id="err-pass2"></div>
  </div>

  <button type="submit">Register Donor</button>
</form>

<p id="count">Total donors: 0</p>

<table id="list">
  <tr>
    <th>Name</th>
    <th>ID</th>
    <th>Blood Group</th>
    <th>Action</th>
  </tr>
</table>

<script>
  let donors = [];

  function setError(id, message) {
    document.getElementById(id).innerHTML = message;
  }

  function updateCount() {
    document.getElementById("count").innerHTML = "Total donors: " + donors.length;
  }

  function validateForm() {
    let valid = true;

    let name = document.getElementById("fname").value.trim();
    let sid = document.getElementById("sid").value;
    let phone = document.getElementById("phone").value;
    let ageText = document.getElementById("age").value;
    let group = document.getElementById("bgroup").value;
    let yes = document.getElementById("donated-yes").checked;
    let no = document.getElementById("donated-no").checked;
    let agree = document.getElementById("agree").checked;
    let pass = document.getElementById("pass").value;
    let pass2 = document.getElementById("pass2").value;

    if (name.length < 3) {
      setError("err-fname", "Name must have at least 3 characters");
      valid = false;
    } 
    else {
      setError("err-fname", "");
    }

    if (!/^[0-9]{2}-[0-9]{5}-[0-9]$/.test(sid)) {
      setError("err-sid", "ID must be in the format 22-12345-1");
      valid = false;
    } 
    else {
      setError("err-sid", "");
    }

    if (!/^[0-9]{11}$/.test(phone)) {
      setError("err-phone", "Mobile must be exactly 11 digits");
      valid = false;
    } 
    else {
      setError("err-phone", "");
    }

    let age = Number(ageText);
    if (ageText.trim() === "" || isNaN(age) || age < 18 || age > 60) {
      setError("err-age", "Age must be between 18 and 60");
      valid = false;
    }
    else {
      setError("err-age", "");
    }

    if (group === "") {
      setError("err-bgroup", "Select a blood group");
      valid = false;
    } 
    else {
      setError("err-bgroup", "");
    }

    if (!yes && !no) {
      setError("err-donated", "Choose Yes or No");
      valid = false;
    } 
    else {
      setError("err-donated", "");
    }

    if (!agree) {
      setError("err-agree", "You must tick the box");
      valid = false;
    } 
    else {
      setError("err-agree", "");
    }

    if (pass.length < 6) {
      setError("err-pass", "Password must have at least 6 characters");
      valid = false;
    } 
    else {
      setError("err-pass", "");
    }

    if (pass2 === "" || pass2 !== pass) {
      setError("err-pass2", "Passwords do not match");
      valid = false;
    } 
    else {
      setError("err-pass2", "");
    }

    if (valid) {
      addDonor(name, sid, group);
      document.getElementById("regForm").reset();
    }

    return false; 
  }

  function addDonor(name, id, group) {
    let donor = { name: name, id: id, group: group };
    donors.push(donor);

    let table = document.getElementById("list");
    let row = document.createElement("tr");

    let cells = [donor.name, donor.id, donor.group];
    for (let i = 0; i < cells.length; i++) {
      let td = document.createElement("td");
      td.appendChild(document.createTextNode(cells[i]));
      row.appendChild(td);
    }

    let actionTd = document.createElement("td");
    let btn = document.createElement("button");
    btn.type = "button";
    btn.appendChild(document.createTextNode("Remove"));
    btn.onclick = function () {
      let index = donors.indexOf(donor);
      donors.splice(index, 1);
      table.removeChild(row);
      updateCount();
    };
    actionTd.appendChild(btn);
    row.appendChild(actionTd);

    table.appendChild(row);
    updateCount();
  }
</script>

</body>
</html>
